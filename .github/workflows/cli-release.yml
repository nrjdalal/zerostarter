name: Release Package

on:
  push:
    branches:
      - canary
    paths:
      - "packages/cli/**"
      # the scripts package holds the release-version script this workflow runs; a change in it re-runs the gate
      - "packages/scripts/**"
      # the matrix gates the publish on the whole suite (bun run test), so a change to any test
      # has to reach it; filtered to the CLI's own tests, a fix elsewhere never re-ran the gate
      - "tests/**"
  workflow_run:
    workflows: ["auto-release"]
    types: [completed]
  release:
    types: [published]
  # a manual run on canary publishes the latest tag's release version: the way back when a release's publish leg failed, since a re-run replays that run's own workflow file. canary only, because the tag is found by what the checkout can reach, and an older ref reaches an older release
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/canary') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    # the publish scopes live on the release job alone; a test matrix needs none of them
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Test
        # The suite lives at the repo root now (one tests/ mirror, no per-package test script), so this step steps out of the job's packages/cli default.
        run: bun run test
        working-directory: .
        # The suite builds packages/* first, and @packages/db reads env while tsdown loads its config, so this needs what auto-check-build already sets. There is no .env on a runner.
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true

  release:
    if: |
      always() && !failure() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/canary') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/release')
      )
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      statuses: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # 24 bundles npm >= 11.5.1, the floor for npm Trusted Publishing
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Release Package
        run: |
          PACKAGE_NAME=$(bunx json -f package.json -a name)
          npm view "$PACKAGE_NAME" 2>/dev/null || { echo "$PACKAGE_NAME does not exist in the npm registry. Skipping publish."; exit 0; }
          VERSIONS=$(npm view $PACKAGE_NAME dist-tags --json)
          LATEST_VERSION=$(echo $VERSIONS | bunx json latest)
          # the CLI has no version of its own (package.json is a 0.0.0 placeholder CI stamps): it ships the repo's release version, read from the tag auto-release created
          if [[ $GITHUB_EVENT_NAME == 'issue_comment' ]]; then
            PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
            PR=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            HEAD_REPO=$(echo "$PR" | bunx json head.repo.full_name)
            # same-repo only: this builds and publishes the PR's own code with the job able to publish, so a fork's install scripts and build must never run here (a fork head is not even fetched today, but the gate must not rest on that)
            [[ $HEAD_REPO == "$GITHUB_REPOSITORY" ]] || { echo "::error::/release publishes same-repo PRs only; #$PR_NUMBER comes from $HEAD_REPO"; exit 1; }
            LATEST_COMMIT_SHA=$(echo "$PR" | bunx json head.sha)
            git checkout $LATEST_COMMIT_SHA
            TAG="test"
            RELEASE_VERSION="0.0.0-${LATEST_COMMIT_SHA:0:7}"
          elif [[ $GITHUB_EVENT_NAME == 'workflow_run' || $GITHUB_EVENT_NAME == 'release' || $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
            # after auto-release cuts the release, publish the CLI at that version from the latest tag. workflow_run fires even though auto-release used GITHUB_TOKEN (release:published does not), and gives a default-branch checkout, so read the tag rather than the event payload.
            git fetch --tags --force --quiet
            RELEASE_TAG=$(git describe --tags --abbrev=0 --match "v*")
            git checkout --quiet "$RELEASE_TAG"
            RELEASE_VERSION="${RELEASE_TAG#v}"
            [[ $RELEASE_VERSION == $LATEST_VERSION ]] && { echo "CLI already at $RELEASE_VERSION on npm. Skipping publish."; exit 0; }
            TAG="latest"
          else
            TAG="canary"
            # preview the next release with the same decision auto-release ships: the larger of the tree and what the window earned. the script imports the scripts package's locked changelogen, so the install (no lifecycle scripts, the job can publish) comes first here; the shared install below is then a no-op
            (cd ../.. && bun install --frozen-lockfile --ignore-scripts)
            DECISION=$(cd ../.. && bun packages/scripts/src/release-version.ts)
            NEXT_VERSION=$(echo "$DECISION" | jq -r .next)
            if [ -z "$NEXT_VERSION" ] || [ "$NEXT_VERSION" = "null" ]; then
              echo "::error::release-version answered nothing usable: $DECISION"
              exit 1
            fi
            TAGGED_VERSION=$(echo $VERSIONS | bunx json $TAG)
            RELEASE_VERSION=$([[ $TAGGED_VERSION == $NEXT_VERSION-canary* ]] && bunx semver $TAGGED_VERSION -i prerelease || echo $NEXT_VERSION-canary.0)
          fi

          bunx json -I -f package.json -e "this.version=\"$RELEASE_VERSION\""
          # no lifecycle scripts while the job can publish; the build needs none
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          bunx json -I -f package.json -e 'delete this.scripts'
          bunx json -I -f package.json -e 'delete this.commitlint'
          bunx json -I -f package.json -e 'delete this.devDependencies'
          # npm Trusted Publishing (OIDC): npm trusts this repo and workflow through id-token: write, so there is no NPM_TOKEN secret, and provenance comes without --provenance
          npm publish --access public --no-git-checks --tag $TAG

          PACKAGE_URL="https://www.npmjs.com/package/$PACKAGE_NAME/v/$RELEASE_VERSION"
          if [[ $GITHUB_EVENT_NAME == 'issue_comment' ]]; then
            curl -fsSL -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" >/dev/null \
              && echo "🟢 Releasing comment deleted!" || echo "🔴 Failed to delete releasing comment."
            curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -d "{\"body\": \"Test package released - [\`$PACKAGE_NAME@$RELEASE_VERSION\`]($PACKAGE_URL)\"}" >/dev/null \
              && echo "🟢 Release comment to PR added!" || echo "🔴 Failed to add release comment to PR."
          else
            curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
              -d "{\"body\": \"Package released - [\`$PACKAGE_NAME@$RELEASE_VERSION\`]($PACKAGE_URL)\"}" >/dev/null \
              && echo "🟢 Release comment added!" || echo "🔴 Failed to add release comment."
            curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\": \"success\", \"context\": \"Package released\", \"description\": \"$PACKAGE_NAME@$RELEASE_VERSION\", \"target_url\": \"$PACKAGE_URL\"}" >/dev/null \
              && echo "🟢 Release status updated!" || echo "🔴 Failed to update release status."
          fi
        # event values reach the script through env, never inline in run, so a payload field is data rather than shell
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
