name: auto-canary-into-main

on:
  push:
    branches: ["canary"]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-canary-into-main:
    name: Auto create PR to merge canary into main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release PR if missing
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_ERR="$(mktemp)"
          if ! gh api repos/${{ github.repository }}/branches/main >/dev/null 2>"$BRANCH_ERR"; then
            if grep -q "HTTP 404" "$BRANCH_ERR"; then
              echo "No main branch yet. A fork's main is created by the CLI and pushed (git push origin canary main); nothing to release until it exists. Skipping."
              exit 0
            fi
            echo "Failed to check for the main branch:" >&2
            cat "$BRANCH_ERR" >&2
            exit 1
          fi
          AHEAD=$(gh api repos/${{ github.repository }}/compare/main...canary --jq '.ahead_by')
          if [ "$AHEAD" -eq 0 ]; then
            echo "canary has no commits ahead of main. Nothing to release. Skipping."
            exit 0
          fi
          # a release window is open from here on: the version step below runs whether the PR is new or already open
          echo "window=open" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh pr list --head canary --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Pull request #$EXISTING already exists. Skipping creation."
            exit 0
          fi
          gh pr create --head canary --base main --draft \
            --title "ci(release): 🚀 merge canary into main" \
            --body "This PR was automatically created to merge changes from canary into main.

          > [!IMPORTANT]
          > Merge with a **merge commit** (not squash), so main keeps shared history with canary and future release diffs stay clean."

      - name: Setup Bun
        if: steps.release.outputs.window == 'open' && github.ref == 'refs/heads/canary'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Move the version forward to what the window has earned
        if: steps.release.outputs.window == 'open' && github.ref == 'refs/heads/canary'
        run: |
          # the number boards with the code: package.json moves to what the window has earned from the last tag (the larger of the tree and changelogen's bump computed from the tag's version; a tree below the tag stops loudly), so main and production carry the released number on the merge. the workflow token's push starts no further workflows, so there is no loop and the next human push recomputes.
          bun install --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          STARTED_FROM=$(git rev-parse HEAD)
          DECISION=$(bun packages/scripts/src/release-version.ts --write)
          echo "$DECISION"
          if [ -z "$(git status --porcelain package.json)" ]; then
            echo "package.json already carries what the window has earned."
            exit 0
          fi
          NEXT=$(echo "$DECISION" | jq -r .next)
          [ -n "$NEXT" ] && [ "$NEXT" != "null" ] || { echo "::error::release-version answered nothing usable: $DECISION"; exit 1; }
          git add package.json
          git commit -m "ci(version): bump to v$NEXT"
          if ! git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git canary; then
            # a human push landing during this run is the one failure that is fine: that push recomputes; anything else is real
            git fetch --quiet origin canary
            if [ "$(git rev-parse origin/canary)" != "$STARTED_FROM" ]; then
              echo "canary moved under this bump; the next push recomputes it."
              exit 0
            fi
            echo "::error::could not push the version bump to canary"
            exit 1
          fi
