pre-commit:
  piped: true
  commands:
    skills-manager:
      priority: 1
      glob:
        - ".agents/skills/**/*.md"
        - "packages/scripts/src/skills-manager.ts"
      run: bun packages/scripts/src/skills-manager.ts && git add AGENTS.md
    lint-staged:
      priority: 2
      run: bunx lint-staged --verbose
      stage_fixed: true
    build:
      run: bun run build
      use_stdin: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    audit:
      # GHSA-fc5q-39xc-vjpf: picomatch has no patched version yet; drop the ignore once one ships
      run: bun audit --audit-level high --ignore GHSA-fc5q-39xc-vjpf
      only:
        - ref: canary
    ensure-branches:
      run: bun packages/scripts/src/ensure-remote-branches.ts {1}
