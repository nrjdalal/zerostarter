pre-commit:
  piped: true
  commands:
    skills-manager:
      priority: 1
      glob:
        - ".agents/skills/**/*.md"
        - ".github/scripts/skills-manager.ts"
      run: bun .github/scripts/skills-manager.ts && git add AGENTS.md
    lint-staged:
      priority: 2
      run: bunx lint-staged --verbose
      stage_fixed: true
    build:
      run: bun run build
      use_stdin: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    audit:
      run: bun audit --audit-level high
      only:
        - ref: canary
    ensure-branches:
      run: bun .github/scripts/ensure-remote-branches.ts {1}
