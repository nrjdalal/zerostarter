pre-commit:
  piped: true
  commands:
    skills-manager:
      priority: 1
      glob:
        - ".agents/skills/**/*.md"
        - "packages/scripts/src/skills-manager.ts"
      run: bun packages/scripts/src/skills-manager.ts && git add AGENTS.md
    deps-manager:
      priority: 2
      glob:
        - "package.json"
        - "**/package.json"
      run: bun packages/scripts/src/deps-manager.ts
      stage_fixed: true
    format:
      priority: 3
      run: bun fmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      priority: 4
      run: bunx oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}
    build:
      run: bun run build
      use_stdin: true

commit-msg:
  commands:
    commit-msg:
      run: bun packages/scripts/src/commit-msg.ts {1}

pre-push:
  commands:
    audit:
      run: bun audit --audit-level high
      only:
        - ref: canary
    ensure-branches:
      run: bun packages/scripts/src/ensure-remote-branches.ts {1}
